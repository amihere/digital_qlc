name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:  
      - name: Set up Elixir
        uses: actions/checkout@v4
        
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '28.0'
          
      - name: Install dependencies
        run: mix deps.get
        
      - name: Run tests
        run: mix test
        
      - name: Build
        run: |
          export MIX_ENV=prod
          mix compile
          mix release

      - name: Connect to tailscale
        uses: tailscale/github-action@v2
        with:
          host: ${{ secrets.TAILSCALE_KEY }}
        
      - name: Verify tailscale
        run: tailscale status && echo "UP"

      - name: Copy File via SSH
        run: |
          scp -o StrictHostKeyChecking=no \
          _build/prod/rel/qlc_digital/bin/qlc_digital \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp
      
        

      
