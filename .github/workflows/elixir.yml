name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:  
      - name: Set up Elixir
        uses: actions/checkout@v4
        
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '28.0'
          
      - name: Install dependencies
        run: mix deps.get
        
      - name: Run tests
        run: mix test
        
      - name: Build
        run: |
          export MIX_ENV=prod
          mix compile
          mix release
          
      - name: Deploy SSH
        run: |
          # cd _build/prod/rel
          touch qlc_app
          echo "${{ secrets.SSH_KEY }}" > id_mongo
          chmod 0644 id_mongo
          scp -i id_mongo qlc_app ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
        

      
