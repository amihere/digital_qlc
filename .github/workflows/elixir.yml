name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu24

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.4'
        otp-version: '28.0'
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
    - name: Build
      run: |
        export MIX_ENV=prod
        mix compile
        mix release
    - name: Deploy SSH
      uses: appleboy/scp-action@master
      run: |
        cd _build/prod/rel
        scp qlc_app ${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }}:/tmp/
        EOF
        

      
